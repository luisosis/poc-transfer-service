# Puerto de nuestro microservicio
quarkus.http.port=8080

# Cliente REST del proveedor simulado en Mockoon
quarkus.rest-client.transfer-provider.url=http://localhost:3001

# Timeouts en milisegundos
quarkus.rest-client.transfer-provider.connect-timeout=2000
quarkus.rest-client.transfer-provider.read-timeout=5000